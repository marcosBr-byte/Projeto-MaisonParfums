services:
  - type: web
    name: maison-parfum
    runtime: docker
    plan: 2c-4g
    region: virginia
    autoDeployTrigger: checksPass
    healthCheckPath: /up
    dockerCommand: ./bin/docker-entrypoint ./bin/rails server --binding=0.0.0.0
    disk:
      name: uploads
      mountPath: /rails/storage
      sizeGB: 10
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: maison-parfum-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: ENC_PRIMARY_KEY
        generateValue: true
      - key: ENC_DETERMINISTIC_KEY
        generateValue: true
      - key: ENC_KEY_DERIVATION_SALT
        generateValue: true
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"
      - key: WEB_CONCURRENCY
        value: "0"

databases:
  - name: maison-parfum-db
    plan: basic-256mb
    region: virginia
    ipAllowList: []
